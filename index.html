<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authorized Only 🔐</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;">

    <audio id="bgMusic" loop preload="auto">
    <source src="https://files.catbox.moe/qnjmjq.mp3" type="audio/mpeg">
    </audio>

    <div class="aura-container">
        <div class="aura-blob aurora"></div>
        <div class="aura-blob violet"></div>
        <div class="aura-blob cyan"></div>
    </div>

    <main id="app-interface">
        <section class="glass-shield">
            <div class="brand-identity">
                <div class="shimmer-logo">💜</div>
                <h1>System Authorization</h1>
                <p>Hello, Queen. Please verify your identity.</p>
            </div>

            <div class="form-control">
                <div class="input-glow-group">
                    <input type="password" id="access-token" placeholder="Enter Secret Key" autocomplete="off">
                </div>
                
                <button id="auth-trigger" onclick="runAuthSequence()">
                    UNLOCK ACCESS
                </button>
            </div>

            <footer id="auth-status">
                <div class="status-dot"></div>
                <span id="status-text">Encrypted Connection Established</span>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
